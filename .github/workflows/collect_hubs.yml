name: collect_hubs

# One-week reliability test of the near-real-time collector (S2) on the 6 Hamburg hubs.
# Every 15 min: fchg per hub; first run of each hour also plan for the next hours. Raw XML
# (gzipped) and a per-run call log go to a private Hugging Face dataset, since runners keep
# nothing between runs. GitHub may start scheduled runs late or skip some: that is part of
# what this test measures.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect_hubs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Collect Hamburg hubs
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S2_REPO: ${{ vars.HF_S2_REPO }}
        run: uv run python -m dbp.ingest.collect_hubs --state Hamburg
