[project]
name = "bahnpulse"
version = "0.1.0"
description = "Germany-wide Deutsche Bahn punctuality platform: monthly history, 15-min hub collector, dbt model, Streamlit app and AI question answering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "requests>=2.32",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "dbt-duckdb>=1.11.0",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
