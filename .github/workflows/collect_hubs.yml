name: collect_hubs

# One-week reliability test of the near-real-time collector (S2) on the 6 Hamburg hubs.
# Hourly (minute 7, away from the busy top of the hour): fchg plus plan for the current
# and next two hours per hub. Raw XML (gzipped) and a per-run call log go to a private Hugging
# Face dataset, since runners keep nothing between runs. GitHub's own cron skipped most runs,
# so an external cron (cron-job.org, "7 * * * *") triggers this via the workflow_dispatch API.
# The test also measures whether hourly fchg snapshots miss delays of trains that passed
# between runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect_hubs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Collect Hamburg hubs
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S2_REPO: ${{ vars.HF_S2_REPO }}
        run: uv run python -m dbp.ingest.collect_hubs --state Hamburg --plan
